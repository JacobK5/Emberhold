name: Build and Upload

on:
  push:
    branches: [master]

jobs:
  # ─── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Read version and short SHA
        id: id
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          $sha = '${{ github.sha }}'.Substring(0,7)
          echo "ver=$ver" >> $env:GITHUB_OUTPUT
          echo "short=$sha" >> $env:GITHUB_OUTPUT

      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish Emberhold/Emberhold.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win

      - name: Stage artifact
        shell: pwsh
        run: Copy-Item "publish/win/Emberhold.exe" "Emberhold-win-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.exe"

      - name: Install Google API client
        run: python -m pip install google-api-python-client google-auth --quiet

      - name: Upload to Google Drive
        shell: python
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          FILE_PATH: Emberhold-win-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.exe
        run: |
          import os, json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          sa_info   = json.loads(os.environ["GDRIVE_SERVICE_ACCOUNT_JSON"])
          folder_id = os.environ["GDRIVE_FOLDER_ID"]
          file_path = os.environ["FILE_PATH"]

          creds = service_account.Credentials.from_service_account_info(
              sa_info, scopes=["https://www.googleapis.com/auth/drive"]
          )
          svc = build("drive", "v3", credentials=creds)

          result = svc.files().create(
              body={"name": os.path.basename(file_path), "parents": [folder_id]},
              media_body=MediaFileUpload(file_path, resumable=True),
              fields="id,name,webViewLink",
          ).execute()

          svc.permissions().create(
              fileId=result["id"],
              body={"type": "anyone", "role": "reader"},
          ).execute()

          print(f"Uploaded: {result['name']}  ->  {result['webViewLink']}")

  # ─── macOS (x64 + arm64 zipped together) ────────────────────────────────────
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Read version and short SHA
        id: id
        run: |
          echo "ver=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # osx-x64 is cross-compiled from this arm64 runner; .NET 8 supports this
      - name: Publish osx-x64
        run: |
          dotnet publish Emberhold/Emberhold.csproj \
            -c Release \
            -r osx-x64 \
            --self-contained true \
            -o publish/mac-x64

      - name: Publish osx-arm64
        run: |
          dotnet publish Emberhold/Emberhold.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -o publish/mac-arm64

      - name: Create zip
        run: |
          chmod +x publish/mac-x64/Emberhold publish/mac-arm64/Emberhold
          (cd publish && zip -r "../Emberhold-mac-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.zip" mac-x64/ mac-arm64/)

      - name: Install Google API client
        run: python -m pip install google-api-python-client google-auth --quiet

      - name: Upload to Google Drive
        shell: python
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          FILE_PATH: Emberhold-mac-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.zip
        run: |
          import os, json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          sa_info   = json.loads(os.environ["GDRIVE_SERVICE_ACCOUNT_JSON"])
          folder_id = os.environ["GDRIVE_FOLDER_ID"]
          file_path = os.environ["FILE_PATH"]

          creds = service_account.Credentials.from_service_account_info(
              sa_info, scopes=["https://www.googleapis.com/auth/drive"]
          )
          svc = build("drive", "v3", credentials=creds)

          result = svc.files().create(
              body={"name": os.path.basename(file_path), "parents": [folder_id]},
              media_body=MediaFileUpload(file_path, resumable=True),
              fields="id,name,webViewLink",
          ).execute()

          svc.permissions().create(
              fileId=result["id"],
              body={"type": "anyone", "role": "reader"},
          ).execute()

          print(f"Uploaded: {result['name']}  ->  {result['webViewLink']}")
