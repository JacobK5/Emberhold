name: Build and Release

on:
  push:
    branches: [master]

jobs:
  # ─── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version and short SHA
        id: id
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          $sha = '${{ github.sha }}'.Substring(0,7)
          echo "ver=$ver" >> $env:GITHUB_OUTPUT
          echo "short=$sha" >> $env:GITHUB_OUTPUT

      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish Emberhold/Emberhold.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win

      - name: Stage artifact
        shell: pwsh
        run: Copy-Item "publish/win/Emberhold.exe" "Emberhold-win-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Emberhold-win-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.exe

  # ─── macOS (ad-hoc-signed .app bundle per arch) ─────────────────────────────
  # A bare executable + loose dylibs gets Gatekeeper-assessed file by file:
  # approving the app still leaves libhostfxr.dylib (etc.) blocked. Wrapping the
  # publish output in a signed .app bundle makes the approval cover the whole
  # bundle, so one right-click → Open is enough.
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version and short SHA
        id: id
        run: |
          echo "ver=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Publish osx-x64
        run: |
          dotnet publish Emberhold/Emberhold.csproj \
            -c Release \
            -r osx-x64 \
            --self-contained true \
            -o publish/mac-x64

      - name: Publish osx-arm64
        run: |
          dotnet publish Emberhold/Emberhold.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -o publish/mac-arm64

      - name: Assemble, sign, and zip .app bundles
        run: |
          ver='${{ steps.id.outputs.ver }}'
          short='${{ steps.id.outputs.short }}'

          make_app () {
            local src="$1" arch="$2"
            local stage="staging-$arch"
            local app="$stage/Emberhold.app"

            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp -a "$src/." "$app/Contents/MacOS/"
            rm -f "$app/Contents/MacOS/"*.pdb
            chmod +x "$app/Contents/MacOS/Emberhold"
            sed "s/__VERSION__/$ver/g" packaging/mac/Info.plist.in > "$app/Contents/Info.plist"

            # Ad-hoc sign EVERY file, inner-to-outer, then seal the bundle.
            # codesign classifies the managed .dlls (PE) and the extensionless
            # createdump (Mach-O) as nested code, so signing only dylibs makes
            # the bundle seal fail with "code object is not signed at all".
            # Non-Mach-O signatures land in extended attributes. No hardened
            # runtime (the .NET JIT needs entitlements under it, and ad-hoc
            # can't notarize anyway).
            find "$app/Contents/MacOS" -type f -print0 | xargs -0 -n1 codesign --force --sign -
            codesign --force --sign - "$app"

            cp packaging/mac/README-FIRST.txt "$stage/"
            # ditto preserves bundle structure; --sequesterRsrc keeps the
            # xattr-based signatures alive through the zip round-trip.
            ditto -c -k --sequesterRsrc "$stage" "Emberhold-mac-$arch-v$ver-$short.zip"
          }

          make_app publish/mac-x64 x64
          make_app publish/mac-arm64 arm64

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: Emberhold-mac-*.zip

  # ─── Publish GitHub Release ──────────────────────────────────────────────────
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version and short SHA
        id: id
        run: |
          echo "ver=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: windows-build

      - uses: actions/download-artifact@v4
        with:
          name: mac-build

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}
          name: v${{ steps.id.outputs.ver }} (${{ steps.id.outputs.short }})
          body: |
            **Windows:** download the `.exe` and run it.

            **macOS:** download the zip for your Mac — `arm64` for Apple Silicon (M1–M4), `x64` for Intel — unzip, then **right-click `Emberhold.app` → Open → Open** (one-time; the app is ad-hoc signed, not notarized). If macOS still refuses: System Settings → Privacy & Security → "Open Anyway", or run `xattr -cr Emberhold.app` in Terminal. Details in the bundled `README-FIRST.txt`.
          files: |
            Emberhold-win-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.exe
            Emberhold-mac-*.zip
