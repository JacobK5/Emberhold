name: Build and Release

on:
  push:
    branches: [master]

jobs:
  # ─── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version and short SHA
        id: id
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          $sha = '${{ github.sha }}'.Substring(0,7)
          echo "ver=$ver" >> $env:GITHUB_OUTPUT
          echo "short=$sha" >> $env:GITHUB_OUTPUT

      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish Emberhold/Emberhold.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win

      - name: Stage artifact
        shell: pwsh
        run: Copy-Item "publish/win/Emberhold.exe" "Emberhold-win-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Emberhold-win-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.exe

  # ─── macOS (x64 + arm64 zipped together) ────────────────────────────────────
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version and short SHA
        id: id
        run: |
          echo "ver=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Publish osx-x64
        run: |
          dotnet publish Emberhold/Emberhold.csproj \
            -c Release \
            -r osx-x64 \
            --self-contained true \
            -o publish/mac-x64

      - name: Publish osx-arm64
        run: |
          dotnet publish Emberhold/Emberhold.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -o publish/mac-arm64

      - name: Create zip
        run: |
          chmod +x publish/mac-x64/Emberhold publish/mac-arm64/Emberhold
          (cd publish && zip -r "../Emberhold-mac-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.zip" mac-x64/ mac-arm64/)

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: Emberhold-mac-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.zip

  # ─── Publish GitHub Release ──────────────────────────────────────────────────
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version and short SHA
        id: id
        run: |
          echo "ver=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: windows-build

      - uses: actions/download-artifact@v4
        with:
          name: mac-build

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}
          name: v${{ steps.id.outputs.ver }} (${{ steps.id.outputs.short }})
          files: |
            Emberhold-win-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.exe
            Emberhold-mac-v${{ steps.id.outputs.ver }}-${{ steps.id.outputs.short }}.zip
